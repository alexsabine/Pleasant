# Publishes the committed static export (site/) to GitHub Pages.
# Regenerate the export with:  cd web && python manage.py export_static --out ../site --base /Pleasant/
name: Static preview on GitHub Pages
on:
  push:
    branches: [main, claude/tender-dijkstra-a7w57t]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
